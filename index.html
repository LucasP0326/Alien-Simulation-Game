<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alien Observation Station</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">INTERSTELLAR OBSERVATORY</p>
          <h1>Alien Observation Station: Earth</h1>
        </div>
        <div class="mission-badge">
          <span>Day</span>
          <strong id="dayCounter">1</strong>
        </div>
      </header>

      <main class="game-layout">
        <section class="stats-panel">
          <h2>Station Metrics</h2>
          <div class="stat">
            <div class="stat-header"><span>Empathy</span><span id="empathyValue">50</span></div>
            <div class="bar"><span id="empathyFill"></span></div>
          </div>
          <div class="stat">
            <div class="stat-header"><span>Influence</span><span id="influenceValue">50</span></div>
            <div class="bar"><span id="influenceFill"></span></div>
          </div>
          <div class="stat">
            <div class="stat-header"><span>Fear</span><span id="fearValue">50</span></div>
            <div class="bar"><span id="fearFill"></span></div>
          </div>
          <div class="stat">
            <div class="stat-header"><span>Hope</span><span id="hopeValue">50</span></div>
            <div class="bar"><span id="hopeFill"></span></div>
          </div>
          <div class="stat">
            <div class="stat-header"><span>Control</span><span id="controlValue">50</span></div>
            <div class="bar"><span id="controlFill"></span></div>
          </div>
          <div class="stat">
            <div class="stat-header"><span>Station Integrity</span><span id="integrityValue">100</span></div>
            <div class="bar"><span id="integrityFill"></span></div>
          </div>
        </section>

        <section class="story-panel">
          <div id="eventCard" class="event-card">
            <p class="eyebrow">CURRENT EVENT</p>
            <h2 id="eventTitle">Initializing</h2>
            <p id="eventText"></p>
            <div id="choices" class="choices"></div>
          </div>
        </section>

        <aside class="log-panel">
          <h2>Mission Feed</h2>
          <ul id="logList"></ul>
        </aside>
      </main>
    </div>

    <div id="endingOverlay" class="overlay hidden">
      <div class="ending-card">
        <p class="eyebrow">MISSION END</p>
        <h2 id="endingTitle">The Earth has changed.</h2>
        <p id="endingDescription"></p>
        <button id="restartButton">Restart Simulation</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
